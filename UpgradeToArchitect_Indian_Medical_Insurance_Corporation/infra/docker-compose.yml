version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: medical-postgres
    environment:
      POSTGRES_USER: medical_user
      POSTGRES_PASSWORD: medical_password
      POSTGRES_DB: medical_insurance
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medical_user -d medical_insurance"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - medical-network

  # PgAdmin for Database Management (Optional)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: medical-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@medical.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - medical-network

  # Intranet Site
  intranet-site:
    build:
      context: ../intranet-site
      dockerfile: Dockerfile
    container_name: medical-intranet-site
    ports:
      - "8001:8000"
    environment:
      - APP_NAME=intranet-site
      - ENVIRONMENT=development
      - LOG_LEVEL=INFO
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:8001,http://localhost:8002
      - DATABASE_URL=postgresql://medical_user:medical_password@postgres:5432/medical_insurance
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=medical_insurance
      - DB_USER=medical_user
      - DB_PASSWORD=medical_password
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - medical-network

  # Internet Site
  internet-site:
    build:
      context: ../internet-site
      dockerfile: Dockerfile
    container_name: medical-internet-site
    ports:
      - "8002:8000"
    environment:
      - APP_NAME=internet-site
      - ENVIRONMENT=development
      - LOG_LEVEL=INFO
      - ALLOWED_ORIGINS=*
      - DATABASE_URL=postgresql://medical_user:medical_password@postgres:5432/medical_insurance
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=medical_insurance
      - DB_USER=medical_user
      - DB_PASSWORD=medical_password
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - medical-network

volumes:
  postgres_data:
    driver: local

networks:
  medical-network:
    driver: bridge
